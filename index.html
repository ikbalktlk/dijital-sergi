<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İzler & Katmanlar — Dijital Sergi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #120508;
      --bg-burgundy: #220a10;
      --gold-primary: #D4AF37;
      --gold-dim: #997B28;
      --border-burgundy: rgba(153, 123, 40, 0.25);
    }

    body {
      background-color: var(--bg-dark);
      color: #EDE8DF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(68, 18, 30, 0.5) 0%, transparent 60%),
        radial-gradient(circle at 20% 80%, rgba(45, 10, 18, 0.35) 0%, transparent 50%);
    }

    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-serif { font-family: 'Playfair Display', serif; }

    .canvas-frame {
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.95),
        0 0 35px rgba(212, 175, 55, 0.1),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .sticky-viewport {
      position: sticky;
      top: 100px;
      height: calc(100vh - 130px);
    }

    #zoom-loupe {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 25px rgba(0,0,0,0.85);
      pointer-events: none;
      display: none;
      z-index: 40;
      background-repeat: no-repeat;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #3b121b; border-radius: 3px; }
  </style>
</head>
<body class="selection:bg-[#D4AF37] selection:text-[#120508]">

  <!-- Header -->
  <header class="w-full px-8 py-5 border-b border-[var(--border-burgundy)] bg-[#140609]/90 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="w-2 h-2 rounded-full bg-[var(--gold-primary)] animate-pulse"></span>
      <div>
        <span class="text-[10px] tracking-[0.3em] uppercase text-[var(--gold-primary)] font-semibold">Dijital Sergi</span>
        <h1 class="font-cinzel text-xl tracking-[0.15em] text-stone-100 font-semibold">İZLER & KATMANLAR</h1>
      </div>
    </div>
    
    <button onclick="toggleIndexDrawer()" class="text-xs uppercase tracking-[0.2em] px-4 py-2 border border-[var(--border-burgundy)] rounded hover:border-[var(--gold-primary)] transition-all flex items-center gap-2 text-stone-300">
      <svg class="w-3.5 h-3.5 text-[var(--gold-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      Eser Dizini
    </button>
  </header>

  <!-- Ana Bölüm (Split-Screen Scrollytelling) -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
      
      <!-- Sol Taraf: Sabit Müze Tuvali -->
      <div class="lg:col-span-7 sticky-viewport flex flex-col justify-center items-center">
        
        <div class="absolute -top-10 w-96 h-96 bg-[radial-gradient(ellipse_at_center,rgba(212,175,55,0.12)_0%,transparent_70%)] pointer-events-none"></div>

        <div id="canvas-container" class="relative w-full max-w-[520px] aspect-[4/5] bg-[#1a080d] p-3 rounded border border-[var(--border-burgundy)] canvas-frame cursor-crosshair group flex items-center justify-center overflow-hidden">
          
          <!-- Açılış Görseli -->
          <img id="active-artwork" src="static_images/dalmacyali" alt="Aktif Eser" class="w-full h-full object-contain rounded transition-opacity duration-300 select-none" />

          <!-- Büyüteç -->
          <div id="zoom-loupe"></div>

          <!-- Rozet -->
          <div class="absolute bottom-5 left-5 bg-[#140609]/90 backdrop-blur-md px-3 py-1.5 border border-[var(--border-burgundy)] text-[10px] tracking-[0.2em] uppercase text-stone-300">
            Tuval Üzeri Yağlı Boya
          </div>

          <div class="absolute top-5 right-5 bg-[#140609]/80 backdrop-blur-sm px-3 py-1 rounded text-[10px] tracking-widest text-[var(--gold-primary)] opacity-0 group-hover:opacity-100 transition-opacity">
            + DOKUYU BÜYÜT
          </div>
        </div>

        <!-- Butonlar -->
        <div class="flex items-center gap-4 mt-6">
          <button onclick="openScaleModal()" class="px-4 py-2 bg-[#1f090e] border border-[var(--border-burgundy)] rounded text-xs tracking-wider text-stone-300 hover:text-[var(--gold-primary)] hover:border-[var(--gold-primary)] transition-all flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-[var(--gold-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            Ölçeği Gör (1:1)
          </button>
          <button onclick="openLightbox()" class="px-4 py-2 bg-[#1f090e] border border-[var(--border-burgundy)] rounded text-xs tracking-wider text-stone-300 hover:text-[var(--gold-primary)] hover:border-[var(--gold-primary)] transition-all flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-[var(--gold-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            Tam Ekran İncele
          </button>
        </div>
      </div>

      <!-- Sağ Taraf: Kayan Sergi Kartları -->
      <div id="artworks-stream" class="lg:col-span-5 flex flex-col space-y-44 py-12"></div>

    </div>
  </main>

  <!-- 1:1 Ölçek Modal -->
  <div id="scale-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-6">
    <div class="bg-[#1f090f] border border-[var(--border-burgundy)] max-w-xl w-full p-8 rounded relative">
      <button onclick="closeScaleModal()" class="absolute top-5 right-5 text-stone-400 hover:text-[var(--gold-primary)] text-xl">✕</button>
      <span class="text-[10px] tracking-[0.3em] uppercase text-[var(--gold-primary)] font-semibold">Mimari Asım Oranı</span>
      <h3 id="scale-modal-title" class="font-cinzel text-xl text-stone-100 mt-1 mb-6">Ölçeklendirme</h3>
      
      <div class="h-80 bg-[#120508] border border-[var(--border-burgundy)] rounded flex items-end justify-center gap-12 p-6 relative">
        <div class="absolute bottom-6 left-8 right-8 border-b border-stone-700/50"></div>
        
        <div class="flex flex-col items-center z-10">
          <svg class="w-16 h-56 text-stone-500/70" viewBox="0 0 24 80" fill="currentColor">
            <circle cx="12" cy="10" r="6" />
            <path d="M6 22 C6 18, 18 18, 18 22 L16 52 L15 76 L9 76 L8 52 Z" />
          </svg>
          <span class="text-[10px] text-stone-400 mt-2">175 cm (İnsan)</span>
        </div>

        <div class="flex flex-col items-center mb-16 z-10">
          <div id="scale-preview-box" class="border-2 border-[var(--gold-primary)] bg-[#2b0c15] shadow-lg flex items-center justify-center">
            <span id="scale-modal-dims" class="text-[9px] text-[var(--gold-primary)] p-1 text-center font-mono">100x80</span>
          </div>
          <span class="text-[10px] text-stone-400 mt-2">Asım Yüksekliği</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Tam Ekran Lightbox -->
  <div id="lightbox-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-6">
    <button onclick="closeLightbox()" class="absolute top-6 right-8 text-stone-400 hover:text-[var(--gold-primary)] text-3xl font-light">✕</button>
    <img id="lightbox-img" src="" class="max-h-[85vh] max-w-[90vw] object-contain border border-[var(--border-burgundy)]" />
    <div id="lightbox-caption" class="text-stone-300 text-sm mt-4 font-serif italic tracking-wide"></div>
  </div>

  <!-- Eser Dizin Çekmecesi -->
  <div id="index-drawer" class="fixed inset-y-0 right-0 w-80 bg-[#16060a] border-l border-[var(--border-burgundy)] z-50 translate-x-full transition-transform duration-300 p-6 flex flex-col">
    <div class="flex justify-between items-center pb-4 border-b border-[var(--border-burgundy)] mb-6">
      <span class="font-cinzel text-stone-200 tracking-wider text-sm font-semibold">SERGİ SEÇKİSİ</span>
      <button onclick="toggleIndexDrawer()" class="text-stone-400 hover:text-white">✕</button>
    </div>
    <div id="drawer-items" class="flex flex-col gap-4 overflow-y-auto pr-1"></div>
  </div>

  <script>
    // static_images klasörü ve uzantısız dosya adlarıyla tam eşleşen liste
    const EXHIBITS = [
      {
        id: "01",
        title: "Dalmaçyalı",
        dimensions: "100 × 80 cm",
        medium: "Keten Tuval Üzeri Yağlı Boya",
        analysis: "Barok kadife koltuk formu ile dalmaçyalı figürünün monokrom kontrastı bir araya gelir. Altın sarısı fon üzerindeki monokrom doku, evcil ile soylu duruş arasındaki uyumu vurgular.",
        palette: ["#8C1822", "#E8D8A6", "#1C1B1A", "#FFFFFF"],
        image: "static_images/dalmacyali",
        scaleWidth: 100,
        scaleHeight: 80
      },
      {
        id: "02",
        title: "Sopranos",
        dimensions: "160 × 90 cm",
        medium: "Geniş Tuval Üzeri Yağlı Boya",
        analysis: "Son Akşam Yemeği kompozisyonu, modern mafya dramasının trajedisi ve sadakat temalarıyla yorumlanır. Merkezdeki figür etrafındaki gerilim ve jestler sahnenin odağını kurar.",
        palette: ["#1F2B37", "#6A1A24", "#D5C4A1", "#121517"],
        image: "static_images/sopranos",
        scaleWidth: 160,
        scaleHeight: 90
      },
      {
        id: "03",
        title: "Salon",
        dimensions: "120 × 90 cm",
        medium: "Tuval Üzeri Yağlı Boya",
        analysis: "Mavi duvar panelleri ve klasik mobilyalar arasında durağan bir aile enstantanesi. Zemine vuran ışık huzmesi mekânın atmosferik derinliğini belirginleştirir.",
        palette: ["#4A7C9B", "#D4AF37", "#F0EDE6", "#3D271D"],
        image: "static_images/salon",
        scaleWidth: 120,
        scaleHeight: 90
      },
      {
        id: "04",
        title: "Harry Potter",
        dimensions: "110 × 75 cm",
        medium: "Tuval Üzeri Yağlı Boya",
        analysis: "Klasik chiaroscuro ışık-gölge tekniğiyle aktarılan Seçmen Şapka sahnesi. Zümrüt yeşili pelerinin dokusu ile katmanlı şapkanın formu kompozisyonu dengeler.",
        palette: ["#1B4332", "#473322", "#E0A96D", "#1C1C1C"],
        image: "static_images/harrypotter",
        scaleWidth: 110,
        scaleHeight: 75
      },
      {
        id: "05",
        title: "Büst",
        dimensions: "95 × 65 cm",
        medium: "Tuval Üzeri Yağlı Boya",
        analysis: "Helenistik büst formunun gri tonlamalı fırça darbeleri ve sarı zemin dengesi. Mermerin sert hissi, tuval üzerinde akıcı bir derinliğe kavuşur.",
        palette: ["#D4A328", "#333333", "#7D7D7D", "#EBEBEB"],
        image: "static_images/bust",
        scaleWidth: 95,
        scaleHeight: 65
      },
      {
        id: "06",
        title: "Şükran",
        dimensions: "90 × 60 cm",
        medium: "Tuval Üzeri Yağlı Boya",
        analysis: "Kahverengi ve bordo geometrik doku katmanları önünde dingin bir dua duruşu. Tipografik 'Şükran' vurgusu ile figürün içsel huzuru bir araya gelir.",
        palette: ["#4A231C", "#8C3A44", "#E5D9C5", "#211412"],
        image: "static_images/sukran",
        scaleWidth: 90,
        scaleHeight: 60
      }
    ];

    let currentExhibitIndex = 0;
    const activeArtwork = document.getElementById('active-artwork');
    const streamContainer = document.getElementById('artworks-stream');
    const drawerContainer = document.getElementById('drawer-items');

    function renderExhibition() {
      EXHIBITS.forEach((item, idx) => {
        const card = document.createElement('article');
        card.id = `exhibit-${idx}`;
        card.className = "exhibit-card bg-[#220a10]/80 p-8 border border-[var(--border-burgundy)] rounded backdrop-blur-md shadow-2xl transition-all duration-300";
        card.setAttribute('data-idx', idx);

        card.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <span class="text-[11px] font-semibold tracking-[0.25em] text-[var(--gold-primary)] uppercase">ESER NO. ${item.id}</span>
            <span class="text-[11px] text-stone-400 font-mono">${item.dimensions}</span>
          </div>
          <h2 class="font-serif text-3xl text-stone-100 font-normal mb-2">${item.title}</h2>
          <div class="text-xs text-[var(--gold-dim)] pb-3 border-b border-[var(--border-burgundy)] mb-5">
            ${item.medium}
          </div>
          <p class="text-sm leading-relaxed text-stone-300 font-light mb-6">
            ${item.analysis}
          </p>
          <div>
            <span class="text-[10px] tracking-widest uppercase text-stone-400 block mb-2 font-mono">Palet & Pigmentler</span>
            <div class="flex gap-2">
              ${item.palette.map(c => `<div class="w-6 h-6 rounded-full border border-black/40 shadow-inner" style="background-color: ${c}" title="${c}"></div>`).join('')}
            </div>
          </div>
        `;
        streamContainer.appendChild(card);

        const drawerItem = document.createElement('div');
        drawerItem.className = "p-3 border border-[var(--border-burgundy)] rounded bg-[#1a080e] hover:border-[var(--gold-primary)] cursor-pointer transition-all flex items-center gap-3";
        drawerItem.onclick = () => {
          scrollToExhibit(idx);
          toggleIndexDrawer();
        };
        drawerItem.innerHTML = `
          <div class="w-10 h-10 bg-[#290c14] border border-[var(--border-burgundy)] flex items-center justify-center font-mono text-xs text-[var(--gold-primary)]">${item.id}</div>
          <div>
            <div class="text-xs text-stone-200 font-serif">${item.title}</div>
            <div class="text-[10px] text-stone-400">${item.dimensions}</div>
          </div>
        `;
        drawerContainer.appendChild(drawerItem);
      });

      updateCanvas(0);
    }

    function updateCanvas(index) {
      currentExhibitIndex = index;
      const data = EXHIBITS[index];

      activeArtwork.style.opacity = '0.2';
      setTimeout(() => {
        activeArtwork.src = data.image;
        activeArtwork.style.opacity = '1';
        setupLoupe(data.image);
      }, 200);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = parseInt(entry.target.getAttribute('data-idx'));
          updateCanvas(idx);
        }
      });
    }, { threshold: 0.6 });

    const container = document.getElementById('canvas-container');
    const loupe = document.getElementById('zoom-loupe');

    function setupLoupe(imgUrl) {
      loupe.style.backgroundImage = `url('${imgUrl}')`;
    }

    container.addEventListener('mouseenter', () => loupe.style.display = 'block');
    container.addEventListener('mouseleave', () => loupe.style.display = 'none');

    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const loupeW = loupe.offsetWidth / 2;
      const loupeH = loupe.offsetHeight / 2;

      loupe.style.left = `${x - loupeW}px`;
      loupe.style.top = `${y - loupeH}px`;

      const zoomLevel = 2.5;
      loupe.style.backgroundSize = `${rect.width * zoomLevel}px ${rect.height * zoomLevel}px`;
      loupe.style.backgroundPosition = `-${x * zoomLevel - loupeW}px -${y * zoomLevel - loupeH}px`;
    });

    function openScaleModal() {
      const cur = EXHIBITS[currentExhibitIndex];
      document.getElementById('scale-modal-title').textContent = cur.title;
      document.getElementById('scale-modal-dims').textContent = cur.dimensions;
      
      const box = document.getElementById('scale-preview-box');
      box.style.width = `${cur.scaleWidth * 1.1}px`;
      box.style.height = `${cur.scaleHeight * 1.1}px`;

      document.getElementById('scale-modal').classList.remove('hidden');
    }
    function closeScaleModal() { document.getElementById('scale-modal').classList.add('hidden'); }

    function openLightbox() {
      const cur = EXHIBITS[currentExhibitIndex];
      document.getElementById('lightbox-img').src = cur.image;
      document.getElementById('lightbox-caption').textContent = `${cur.title} — ${cur.dimensions} (${cur.medium})`;
      document.getElementById('lightbox-modal').classList.remove('hidden');
    }
    function closeLightbox() { document.getElementById('lightbox-modal').classList.add('hidden'); }

    function toggleIndexDrawer() {
      document.getElementById('index-drawer').classList.toggle('translate-x-full');
    }

    function scrollToExhibit(idx) {
      document.getElementById(`exhibit-${idx}`).scrollIntoView({ behavior: 'smooth' });
    }

    renderExhibition();
    document.querySelectorAll('.exhibit-card').forEach(c => observer.observe(c));
  </script>
</body>
</html>
